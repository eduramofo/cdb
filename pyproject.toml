[project]
name = "cdb"
version = "0.1.0"
description = "Teste Técnico Prático — Desenvolvedor Sênior de Automação e Integração"
readme = "README.md"
authors = [
    { name = "Edu Fontes", email = "eduramofo@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.0",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "playwright>=1.61.0",
    "uvicorn>=0.52.0",
]

[project.scripts]
cdb = "cdb:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
